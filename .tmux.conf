#!/usr/bin/env bash
# tmux.conf --- tmux configuration file

set -g default-terminal "xterm-256color"
set-option -g default-shell "/bin/bash"
set -s escape-time 0 #faster command sequences

# keys
unbind-key C-b
set -g prefix "C-a"
bind-key "C-z" send-prefix
unbind '"'
unbind '%'
unbind 'a'
bind a send-prefix
bind - split-window -v
bind = split-window -h

bind-key C-r new-session ssh rurik \; set-option default-command "ssh rurik"
bind-key C-h new-session ssh hyde \; set-option default-command "ssh hyde"
bind-key C-j new-session ssh jekyll \; set-option default-command "ssh jekyll"

# clock mode
setw -g clock-mode-colour colour1

# copy mode
setw -g mode-style 'fg=colour1 bg=colour18 bold'

# pane borders
set -g pane-border-style 'fg=colour1'
set -g pane-active-border-style 'fg=colour3'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=colour1'
set -g status-left ''
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50
set -g status-left-length 10

setw -g window-status-current-style 'fg=colour0 bg=colour1 bold'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=colour1 dim'
setw -g window-status-format ' #I #[fg=colour7]#W #[fg=colour1]#F '

setw -g window-status-bell-style 'fg=colour2 bg=colour1 bold'

# messages
set -g message-style 'fg=colour2 bg=colour0 bold'

setw -g automatic-rename on   # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed
set -g set-titles on          # set terminal title
set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1000      # slightly longer status messages display time
set -g base-index 1

# open new windows in the current path
bind c new-window -c "#{pane_current_path}"

# shhhh
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity on
set -g bell-action none

# reload config with r
unbind r
bind r source-file ~/.tmux.conf

set -g mouse on

#  modes
setw -g clock-mode-colour colour6

# panes
# set -g pane-active-border-style 'bg=colour7 fg=colour3'

# status bar
# set -g status-position bottom
# set -g status-justify left
# set -g status-right '%Y-%m-%d : %H:%M:%S'
# set -g status-right-length 100

# set -g status-left-length 20

# clock mode
setw -g clock-mode-colour colour1

# copy mode
setw -g mode-style 'fg=colour1 bg=colour18 bold'

# pane borders
set -g pane-border-style 'fg=colour1'
set -g pane-active-border-style 'fg=colour3'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=colour1'
set -g status-left ''
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50
set -g status-left-length 10

setw -g window-status-current-style 'fg=colour0 bg=colour1 bold'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=colour1 dim'
setw -g window-status-format ' #I #[fg=colour7]#W #[fg=colour1]#F '

setw -g window-status-bell-style 'fg=colour2 bg=colour1 bold'

# messages
set -g message-style 'fg=colour2 bg=colour0 bold'